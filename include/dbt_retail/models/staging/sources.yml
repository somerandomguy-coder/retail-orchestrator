version: 2

sources:
  - name: landing
    description: "Raw landed transaction Parquet files from retail ingestion channels."
    tables:
      - name: pos_transactions
        description: "Point-of-Sale in-store transactions from physical retail registers."
        meta:
          external_location: "{{ env_var('RAW_DATA_DIR', '/usr/local/airflow/include/data/raw') }}/pos_transactions_*.parquet"
      - name: marketplace_transactions
        description: "Third-party partner marketplace transactions feed (unvetted raw partner extract)."
        meta:
          external_location: "{{ env_var('RAW_DATA_DIR', '/usr/local/airflow/include/data/raw') }}/marketplace_transactions_*.parquet"
