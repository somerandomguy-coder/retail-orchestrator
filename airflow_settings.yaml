# Local development configuration for Airflow Connections, Pools, and Variables
airflow:
  connections:
    - conn_id: duckdb_default
      conn_type: duckdb
      conn_host: ""
      conn_schema: "/usr/local/airflow/include/data/retail.duckdb"
      conn_extra: {}
  pools:
    - pool_name: dbt_pool
      pool_slot: 4
      pool_description: "Dedicated execution pool for dbt transformations"
  variables:
    - variable_name: retail_raw_dir
      variable_value: "/usr/local/airflow/include/data/raw"
    - variable_name: alert_notification_channel
      variable_value: "#data-ops-alerts"
